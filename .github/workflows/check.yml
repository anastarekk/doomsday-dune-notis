name: Check movies

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC)
  workflow_dispatch:          # "Run workflow" button for manual tests

permissions:
  contents: write             # lets the job commit notified.json

concurrency:
  group: check-movies
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python check.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save notified state
        run: |
          git config user.name "movie-notifier"
          git config user.email "actions@users.noreply.github.com"
          git add notified.json
          git diff --cached --quiet || (git commit -m "Update notified movies" && git push)
